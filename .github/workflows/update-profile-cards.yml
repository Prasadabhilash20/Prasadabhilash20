name: Update Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-all-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create output directories
        run: mkdir -p dist profile

      # 1. Download GitHub Stats Card
      - name: Generate Stats Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api?username=${{ github.repository_owner }}&show_icons=true&hide_border=true&bg_color=00000000&title_color=0EA5E9&icon_color=38BDF8&text_color=7DD3FC" -o dist/stats.svg

      # 2. Download Top Languages Card
      - name: Generate Top Languages Card
        run: |
          curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=${{ github.repository_owner }}&layout=compact&hide_border=true&bg_color=00000000&title_color=0EA5E9&text_color=7DD3FC" -o dist/top-langs.svg

      # 3. Download Streak Stats Card
      - name: Generate Streak Card
        run: |
          curl -s "https://github-readme-streak-stats.herokuapp.com/?user=${{ github.repository_owner }}&hide_border=true&background=00000000&ring=38BDF8&fire=0EA5E9&currStreakLabel=38BDF8&sideLabels=7DD3FC&currStreakNum=0EA5E9&sideNums=38BDF8&dates=7DD3FC" -o dist/streak.svg

      # 4. Download Activity Graph
      - name: Generate Activity Graph
        run: |
          curl -s "https://github-readme-activity-graph.vercel.app/graph?username=${{ github.repository_owner }}&theme=react-dark&bg_color=00000000&color=38BDF8&line=0EA5E9&point=7DD3FC&area=true&hide_border=true" -o dist/activity-graph.svg

      # 5. Generate Contribution Snake
      - name: Generate Contribution Snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/blue-snake.svg?color_snake=%230EA5E9&color_dots=%237DD3FC,%2338BDF8,%230EA5E9,%2338BDF8,%237DD3FC

      # 6. Publish ALL generated cards & snake to output branch
      - name: Publish all visuals to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
