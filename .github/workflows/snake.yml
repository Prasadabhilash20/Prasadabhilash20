name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Prasadabhilash20
          outputs: |
            dist/github-snake.svg?color_snake=#EF4444&color_dots=#FEE2E2,#FCA5A5,#F87171,#EF4444,#DC2626
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#EF4444&color_dots=#FEE2E2,#FCA5A5,#F87171,#EF4444,#DC2626

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
