name: Update Activity Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: activity-graph-workflow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_filepath: dist/activity-graph.svg
          theme: react-dark
          bg_color: 0D1117
          color: 38BDF8
          line: 38BDF8
          point: 7DD3FC
          area: true
          hide_border: true

      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          force: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
