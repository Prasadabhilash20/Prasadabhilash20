name: Update Profile Visuals

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: profile-visuals-workflow
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      # 1. Generate Activity Graph
      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          output_filepath: dist/activity-graph.svg
          theme: react-dark
          bg_color: 0D1117
          color: 38BDF8
          line: 38BDF8
          point: 7DD3FC
          area: true
          hide_border: true

      # 2. Generate Contribution Snake (Blue Snake + White Grid)
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Prasadabhilash20
          outputs: |
            dist/github-snake.svg?color_snake=%230EA5E9&color_dots=%23ffffff,%23ffffff,%23ffffff,%23ffffff,%23ffffff
            dist/github-snake-dark.svg?color_snake=%230EA5E9&color_dots=%23ffffff,%23ffffff,%23ffffff,%23ffffff,%23ffffff

      # 3. Single Push to Output Branch
      - name: Publish to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          force: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
